<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MinhNhat Bot Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0a;--bg2:#111;--border:#2a2a2a;--text:#f5f5f5;--muted:#888;--red:#f87171;--yellow:#fbbf24}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .wrap{max-width:720px;margin:0 auto;padding:24px 14px 50px}
    h1{font-family:'Space Grotesk',sans-serif;font-size:1.35rem}
    .sub{color:var(--muted);font-size:.88rem;margin:4px 0 18px}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px}
    label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px}
    input{width:100%;padding:11px 12px;background:#0a0a0a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.88rem;outline:none;margin-bottom:12px}
    .btns{display:flex;gap:8px}
    .btn{padding:10px 16px;border-radius:10px;font-weight:650;font-size:.88rem;border:none;cursor:pointer;font-family:inherit}
    .btn-w{background:#fff;color:#000}.btn-g{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);font-size:.75rem;color:var(--muted);margin-bottom:12px}
    .badge.on{color:#fff;border-color:#555}.dot{width:7px;height:7px;border-radius:50%;background:#555}.badge.on .dot{background:#fff;animation:p 1.4s infinite}
    @keyframes p{50%{opacity:.35}}
    .logs{background:#0a0a0a;border:1px solid var(--border);border-radius:10px;min-height:220px;max-height:360px;overflow-y:auto;padding:10px;font-family:'JetBrains Mono',monospace;font-size:.74rem;line-height:1.45}
    .log{margin-bottom:2px;word-break:break-all}.log.err{color:var(--red)}.log.out{color:#ccc}.log.sys{color:var(--yellow)}
    .err{color:var(--red);font-size:.85rem;display:none;margin-top:8px}
    .note{font-size:.82rem;color:var(--muted);line-height:1.5;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MinhNhat Bot Panel</h1>
    <p class="sub">Chạy full bot Python của bạn · Prefix <code>.</code> · Toàn bộ lệnh gốc</p>

    <div class="card">
      <span class="badge" id="badge"><span class="dot"></span> Offline</span>
      <label>Bot Token</label>
      <input type="password" id="token" placeholder="Dán token bot Discord..." autocomplete="off" />
      <div class="btns">
        <button class="btn btn-w" id="start" type="button">▶ Start bot</button>
        <button class="btn btn-g" id="stop" type="button" disabled>■ Stop</button>
      </div>
      <p class="err" id="err"></p>
      <p class="note">
        Intent cần bật: Message Content, Members, Presence, Voice States.<br>
        Trên Discord gõ <b style="color:#fff">.menu</b> / <b style="color:#fff">.help</b> / <b style="color:#fff">.dev</b><br>
        API AI (OpenRouter, ảnh…) lấy từ biến môi trường server nếu bạn cấu hình.
      </p>
    </div>

    <div class="card">
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:8px">Console</div>
      <div class="logs" id="logs"></div>
    </div>
  </div>
  <script>
    const logsEl=document.getElementById('logs');
    function addLog(e){
      const d=document.createElement('div');
      d.className='log '+(e.type||'sys');
      d.textContent='['+new Date(e.time||Date.now()).toLocaleTimeString('vi-VN')+'] '+e.text;
      logsEl.appendChild(d); logsEl.scrollTop=99999;
    }
    function setOn(on){
      badge.className='badge'+(on?' on':'');
      badge.innerHTML='<span class="dot"></span> '+(on?'Online':'Offline');
      start.disabled=on; stop.disabled=!on;
    }
    async function refresh(){
      try{const r=await fetch('/api/status');const d=await r.json();setOn(!!d.running);}catch{}
    }
    try{
      const es=new EventSource('/api/logs/stream');
      es.onmessage=ev=>{try{addLog(JSON.parse(ev.data));}catch{} refresh();};
    }catch{}
    start.onclick=async()=>{
      err.style.display='none';
      const token=document.getElementById('token').value.trim();
      if(!token){err.textContent='Nhập token';err.style.display='block';return;}
      start.disabled=true;
      try{
        const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||'Lỗi');
        setTimeout(refresh,1500);
      }catch(e){err.textContent=e.message;err.style.display='block';start.disabled=false;}
    };
    stop.onclick=async()=>{await fetch('/api/stop',{method:'POST'});setOn(false);};
    refresh(); setInterval(refresh,4000);
  </script>
</body>
</html>
